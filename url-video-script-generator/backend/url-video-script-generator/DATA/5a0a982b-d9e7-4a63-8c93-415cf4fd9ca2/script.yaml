  scenario_type: product_introduction
  title: プロが設計した究極のワイヤレスマウス
  total_duration: 60
scenes:
- duration: 9.0
  scene_id: 1
  scene_type: opening
  text: ゲームを愛するみなさん、こんにちは。今日は本当に素晴らしい製品をご紹介します。
  voice_settings:
    emotion: cheerful
    pitch: 1.0
    speed: 1.0
- duration: 15.0
  scene_id: 2
  scene_type: problem
  text: ゲームで勝つためには、最高のマウスが欠かせませんよね。でも、重たくて操作性が悪かったり、ワイヤが邪魔だったりと、悩みはつきないですよね。そんな問題を解決するのが、今日お見せするこの製品です。
  voice_settings:
    emotion: serious
    pitch: 1.0
    speed: 1.0
- duration: 27.0
  scene_id: 3
  scene_type: solution
  text: この超軽量ワイヤレスマウスは、esportsプロとの共同開発によって生み出されました。わずか54グラムの軽量デザインで、スムーズな操作性と優れたコントロール性を実現しています。新しい洗練された形状も魅力的ですね。しかも、8つのプログラム可能なボタンで、あなたの好みに合わせてカスタマイズできるのが特徴です。高精度なオプティカルセンサーと業界トップクラスのワイヤレス性能、そして驚きの95時間以上のバッテリー持続時間も魅力的です。まさに、プロゲーマーも認めるハイパフォーマンスなマウスといえるでしょう。
  voice_settings:
    emotion: excited
    pitch: 1.0
    speed: 1.0
- duration: 9.0
  scene_id: 4
  scene_type: cta
  text: この製品で、ゲームの世界を征服しましょう。今すぐ手に入れて、最高のプレイを体験してください!
  voice_settings:
    emotion: enthusiastic
    pitch: 1.0
    speed: 1.0
