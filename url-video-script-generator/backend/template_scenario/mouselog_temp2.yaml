name: "ゲーミングマウス製品紹介"
description: "製品の特徴と利点を効果的に紹介するシナリオ"
structure:
  - section: "problem"
    name: "これまでのゲーミングマウスの課題"
    duration_ratio: 0.15
    description: "ゲーミングマウスを使っているときに、〇〇（製品のメリットで解消できること）に困ったことはありませんか？"
  - section: "opening"
    name: "オープニング"
    duration_ratio: 0.25
    description: "こんにちは！マウスログです、今回は〇〇を解消するゲーミングマウス、{product_name}をご紹介します！！(この製品名の部分は確実に生成してください)"
  - section: "solution"
    name: "紹介するゲーミングマウスのメリットで解決"
    duration_ratio: 0.45
    description: "{product_name}の主要機能である{features}について詳しく説明し、{weight}の軽さと{dimensions}のサイズ感、そして{price}の価格設定についても触れます。"
  - section: "cta"
    name: "行動喚起"
    duration_ratio: 0.15
    description: "視聴者にマウスログで検索し、{product_name}の詳しい情報はサイトで御覧くださいと促す"
voice_settings:
  emotion: "confident"
  speed: 1.0
  pitch: 1.0
  volume: 1.0